<!DOCTYPE html>
<html>
<head>
  <title>Booking - My Car Service</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f8;
      color: #333;
      margin: 20px auto;
      max-width: 900px;
      padding: 0 20px;
      line-height: 1.6;
    }
    nav {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
      font-weight: bold;
    }
    nav a {
      text-decoration: none;
      color: #2A7AE2;
      padding: 10px 15px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }
    nav a:hover,
    nav a.active {
      background-color: #195bb5;
      color: white;
    }
    h1 {
      color: #2A7AE2;
      margin-bottom: 20px;
      text-align: center;
      text-transform: uppercase;
    }
    form {
      background: white;
      padding: 20px 30px;
      max-width: 600px;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      margin-top: 6px;
      padding: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      resize: vertical;
    }
    button {
      margin-top: 20px;
      background-color: #2A7AE2;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #195bb5;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="repairs.html">Repairs</a>
  <a href="why-us.html">Why Us</a>
  <a href="booking.html" class="active">Booking</a>
</nav>
<form>
    <main>
  <h1>Book Your Appointment</h1>

  <p style="font-weight: bold; color: #e60000; font-size: 18px; text-align: center; margin-bottom: 20px;">
    You can book your appointment one day before!
  </p>

  <form>
    <!-- your booking form fields here -->
  </form>
</main>

  <label for="name">Name:</label>
  <input type="text" id="name" name="name" placeholder="Your full name" required>

  <label for="phone">Phone / WhatsApp Number:</label>
  <input type="tel" id="phone" name="phone" placeholder="e.g. 07123456789" required>

  <label for="vehicle">Vehicle Registration Number:</label>
  <input type="text" id="vehicle" name="vehicle" placeholder="Your vehicle registration" required>

  <label for="make">Make / Model / Year:</label>
  <input type="text" id="make" name="make" placeholder="Car make, model, and year" required>

  <label for="service">Service Needed:</label>
  <select id="service" name="service" required>
    <option value="">-- Select a service --</option>
    <option value="oilchange">Engine oil & filter change</option>
    <option value="brakepad">Front brake pads</option>
    <option value="battery">Battery replacement</option>
    <option value="diagnostics">Basic diagnostics</option>
    <option value="other">Other small mechanical jobs</option>
  </select>

  <label for="date">Preferred Date:</label>
  <input type="date" id="date" name="date">

  <label for="time">Preferred Time:</label>
  <input type="time" id="time" name="time">

  <label for="info">Additional Information:</label>
  <textarea id="info" name="info" rows="4" placeholder="Anything else you'd like us to know"></textarea>

  <button type="submit">Send Booking Request</button>
</form>

</body>
</html>
